[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-incident-copilot"
version = "0.1.0"
description = "AI-assisted incident triage: correlate signals into ranked, evidence-cited root causes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ollama = ["requests>=2.31"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["aiops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
